name: Profile charts

# Regenerates the SVG charts embedded in README.md and publishes them to the
# `output` branch, so the profile never depends on third-party image services.
on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_profile_charts.py
      - .github/workflows/profile-charts.yml

permissions:
  contents: write

concurrency:
  group: profile-charts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats, activity and language charts
        env:
          # Optional: add a classic PAT (read:user) as METRICS_TOKEN to include
          # private contributions; the default token covers public activity.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          EXCLUDED_LANGUAGES: Jupyter Notebook
        run: python scripts/generate_profile_charts.py --user "${{ github.repository_owner }}" --out dist

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update profile charts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
